name: Update Item Database from Wiki

on:
  # Run weekly on Mondays at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install scraper dependencies
        run: uv sync --frozen --only-group update-db --no-install-project

      - name: Run wiki scraper (merge mode)
        run: uv run --frozen --no-sync python update_db.py --merge

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ arlo.db \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ arlo.db
          # Drop legacy root-level catalog files if still present
          git rm -f --ignore-unmatch \
            items.csv items.db quests.csv quests.db \
            projects.csv projects.db traders.csv traders.db \
            missing_items.csv
          git commit -m "Auto-update catalog [$(date -u +%Y-%m-%d)]"
          git push

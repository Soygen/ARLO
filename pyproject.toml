[project]
name = "arlo"
version = "1.0.0"
description = "Item recommendation overlay for Arc Raiders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "mss>=9.0.0",
    "pynput>=1.7.0",
    "evdev>=1.6; sys_platform == 'linux'",
    "python-xlib>=0.17; sys_platform == 'linux'",
    # Wayland capture (portal/PipeWire). Always on Linux so plain `uv sync` /
    # `uv run` is enough — no repeated `uv sync --extra wayland`.
    "pygobject>=3.50; sys_platform == 'linux'",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0",
    "basedpyright>=1.40.2",
    "pre-commit>=4.7.0",
]
# Kept as a no-op alias so older docs / `uv sync --extra wayland` still work.
wayland = []

# Scraper-only deps for CI (same locked versions as project.dependencies,
# without pulling in overlay packages like evdev/pillow on the runner).
[dependency-groups]
dev = []
update-db = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
arc-helper = "arc_helper.main:main"
arc-calibrate = "arc_helper.calibrate:main"
arc-update-db = "update_db:main"
arc-import-progress = "arc_helper.progress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_helper"]

[tool.ruff]
line-length = 88 # as black
indent-width = 4
target-version = "py311"
exclude = [
  "docs/superpowers",
]

[tool.ruff.format]
docstring-code-format = true

# https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
preview = true
select = [
  # "AIR",   # Airflow (AIR)
  # "ERA",   # eradicate (ERA)
  "FAST", # FastAPI (FAST)
  "YTT",  # flake8-2020 (YTT)
  "ANN",  # flake8-annotations (ANN)
  "ASYNC", # flake8-async (ASYNC)
  # Curated bandit (S) — easy wins only; not the full security suite
  "S102", # exec
  "S110", # try-except-pass
  "S112", # try-except-continue
  "S301", # pickle
  "S302", # marshal
  "S306", # mktemp
  "BLE", # flake8-blind-except (BLE)
  "FBT", # flake8-boolean-trap (FBT)
  "B",   # flake8-bugbear (B)
  "A",   # flake8-builtins (A)
  "COM", # flake8-commas (COM)
  "C4",  # flake8-comprehensions (C4)
  # "CPY",   # flake8-copyright (CPY)
  "DTZ", # flake8-datetimez (DTZ)
  # "T10",   # flake8-debugger (T10)
  # "DJ",    # flake8-django (DJ)
  "EM", # flake8-errmsg (EM)
  # "EXE",   # flake8-executable (EXE)
  # "FIX",   # flake8-fixme (FIX)
  "FA",  # flake8-future-annotations (FA)
  "INT", # flake8-gettext (INT)
  "ISC", # flake8-implicit-str-concat (ISC)
  "ICN", # flake8-import-conventions (ICN)
  "LOG", # flake8-logging (LOG)
  "G",   # flake8-logging-format (G)
  "INP", # flake8-no-pep420 (INP)
  "PIE", # flake8-pie (PIE)
  # "T20",   # flake8-print (T20)
  "PYI",  # flake8-pyi (PYI)
  "PT",   # flake8-pytest-style (PT)
  "Q",    # flake8-quotes (Q)
  "RSE",  # flake8-raise (RSE)
  "RET",  # flake8-return (RET)
  "SLF",  # flake8-self (SLF)
  "SIM",  # flake8-simplify (SIM)
  "SLOT", # flake8-slots (SLOT)
  "TID",  # flake8-tidy-imports (TID)
  # "TD",    # flake8-todos (TD)
  "TC",   # flake8-type-checking (TC)
  "ARG",  # flake8-unused-arguments (ARG)
  "PTH",  # flake8-use-pathlib (PTH)
  "FLY",  # flynt (FLY)
  "I",    # isort (I)
  "C90",  # mccabe (C90)
  "NPY",  # NumPy-specific rules (NPY)
  "PD",   # pandas-vet (PD)
  "N",    # pep8-naming (N)
  "PERF", # Perflint (PERF)
  "E",    # pycodestyle (E, W) Error (E)
  "W",    # pycodestyle (E, W) Warning (W)
  # "DOC",  # pydoclint (DOC)
  # "D",    # pydocstyle (D)
  "F", # Pyflakes (F)
  # "PGH",  # pygrep-hooks (PGH)
  "PL",   # Pylint (PL)
  "PLC",  # Convention (PLC)
  "PLE",  # Error (PLE)
  "PLR",  # Refactor (PLR)
  "PLW",  # Warning (PLW)
  "UP",   # pyupgrade (UP)
  "FURB", # refurb (FURB)
  "RUF",  # Ruff-specific rules (RUF)
  "TRY",  # tryceratops (TRY)
]
ignore = [
  # Intentional / formatter conflicts (keep)
  "A002",    # BaseHTTPRequestHandler.log_message uses `format`
  "ANN401",  # Allow typing.Any at intentional boundary sites
  "COM812",  # Trailing-comma rule conflicts with the formatter
  "E501",    # Line length enforced by the formatter, not the linter
  "PLC0415", # Lazy / platform-gated imports are intentional
  "PLR0904", # Large facade classes (Qt windows, DB) — refactor separately
  "PLW0717", # Large try bodies in I/O / portal setup — refactor with complexity
  "RUF001",  # UI strings intentionally use symbols
  "RUF002",
  "RUF003",
  "RUF201",  # Keep stable code-based selectors in this file
]

# Complexity as regression guards (raised above current worst offenders;
# ratchet down over time as large functions are split).
[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 9
max-positional-args = 8
max-branches = 25
max-returns = 10
max-statements = 110
max-locals = 40
max-public-methods = 40

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",
  "S",
  "SLF001",
  "PLC2701",
  "PLW2901",
  "PT018",
  "ARG",
  "PLR6301",
  "PLR2004",  # Magic numbers in assertions are fine
]
"scripts/**/*.py" = ["ANN", "INP001", "T20", "S", "SLF001", "N802", "PLW1514", "RUF105"]
"build.py" = ["ANN", "G004"]
"update_db.py" = ["BLE001"]  # scraper fallbacks catch broad network/parse failures
"src/arc_helper/map_data.py" = ["BLE001"]  # map I/O / parse fallbacks
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "update_db.py"]
exclude = ["**/__pycache__", "build", "dist", "debug", "tests", "scripts"]
# Qt / GI / JSON API payloads cascade Unknown under strict; keep
# optional/arg/attr checks which catch real bugs. Missing parameter
# annotations are enforced by Ruff ANN instead.
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportPrivateUsage = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Static metadata so uv never builds the PyGObject sdist at lock time
# (PyGObject ships sdist-only; building requires Linux system headers).
[[tool.uv.dependency-metadata]]
name = "pygobject"
requires-dist = ["pycairo>=1.16"]
requires-python = ">=3.9"
